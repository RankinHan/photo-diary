<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>图文记录</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 头部标题 -->
        <header class="header">
            <h1>📸 图文记录</h1>
            <p class="subtitle">记录生活中的美好瞬间</p>
        </header>

        <!-- 添加新记录区域 -->
        <section class="add-record">
            <div class="input-area">
                <textarea id="textInput" placeholder="写下你的想法..." rows="3"></textarea>
                <div class="image-preview-area" id="imagePreviewArea">
                    <div class="image-preview-container" id="imagePreviewContainer"></div>
                </div>
            </div>
            
            <div class="action-bar">
                <button type="button" class="upload-btn" id="uploadBtn">
                    <span>📷 添加图片</span>
                </button>
                <input type="file" id="imageInput" accept="image/*" multiple capture="environment" style="display: none;">
                <button type="button" class="submit-btn" id="submitBtn">✨ 发布记录</button>
            </div>
        </section>

        <!-- 记录列表 -->
        <section class="records-section">
            <h2 class="section-title">📚 我的记录</h2>
            <div class="records-list" id="recordsList">
                <!-- 记录项将动态插入这里 -->
            </div>
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">📝</div>
                <p>还没有记录，开始记录你的第一条图文吧！</p>
            </div>
        </section>
    </div>

    <!-- 图片预览弹窗 -->
    <div class="modal" id="imageModal">
        <span class="modal-close" id="modalClose">&times;</span>
        <img class="modal-content" id="modalImage" alt="预览图片">
    </div>

    <!-- 提示信息 -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
